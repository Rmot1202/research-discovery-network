# CI: every push and pull request is type-checked, tested, and built (including the Docker image).
# CD: Render's web service uses autoDeployTrigger: checksPass (render.yaml), so a push to main
# goes live only after these checks are green.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm exec tsc --noEmit -p .
      - name: Build
        run: pnpm build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t research-discovery-network .
      - name: Smoke test (site and API on one port)
        run: |
          docker run -d --name app -p 8000:8000 research-discovery-network
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/health && break
            sleep 2
          done
          curl -fsS http://localhost:8000/api/health
          curl -fsS http://localhost:8000/ | grep -qi "<html"
          docker logs app | tail -20
