# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Creates the web app (API + website in one Docker service). The database is NOT on Render:
# free Render Postgres expires 30 days after creation and is deleted 14 days later, so the data
# lives on Neon's free plan instead (1 GB, no expiry). Paste the Neon connection string into
# DATABASE_URL below and into the GitHub secret DATABASE_URL.
# New papers arrive daily via .github/workflows/update-papers.yml.
services:
  - type: web
    name: research-discovery-network
    runtime: docker
    plan: free            # free instances sleep after 15 min idle; "starter" stays awake
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass  # CD: deploy each push to main only after GitHub CI passes
    envVars:
      - key: PUBLISH_MODE
        value: auto           # auto: new papers go public right away; review: only approved papers are featured
      - key: DATABASE_URL
        sync: false           # Neon connection string (postgresql://...neon.tech/...?sslmode=require)
      - key: FIREBASE_PROJECT_ID
        sync: false           # Firebase console -> Project settings -> Project ID
      - key: FIREBASE_WEB_API_KEY
        sync: false           # Firebase console -> Project settings -> Web API key (public, not a secret)
      - key: FIREBASE_AUTH_DOMAIN
        sync: false           # optional; defaults to <project-id>.firebaseapp.com
      - key: ADMIN_EMAILS
        sync: false           # comma-separated Google accounts allowed into Admin
      - key: ADMIN_API_TOKEN
        generateValue: true   # fallback login and for scripts; Firebase sign-in is the normal way in
      - key: AI_BASE_URL
        sync: false           # optional: any OpenAI-compatible provider for the assistant
      - key: AI_API_KEY
        sync: false
      - key: AI_CHAT_MODEL
        sync: false
      - key: AI_EMBEDDING_MODEL
        sync: false
      - key: OPENALEX_API_KEY
        sync: false           # optional: larger daily budget for the paper scan

